<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互动课件</title>
<style>
/* ===== 基础色板：沿用学生合订本第10讲 ===== */
:root{
  --paper:#fffdf8;--paper2:#fbfaf4;--ink:#2d3833;--sub:#6c776f;--hair:#e1e5dc;
  --green:#4c8d61;--green-d:#2f6e4b;--green-soft:#e7f2e4;
  --blue:#4f87a3;--blue-d:#33698a;--blue-soft:#e4f0f6;
  --orange:#d77a50;--orange-d:#b45c36;--orange-soft:#fde9dc;
  --violet:#746d96;--violet-soft:#efecf7;
  --note:#ffedbd;--note-line:#e9d6a3;--tan:#9e7350;--teal:#1b5e58;--leaf:#5d987e;
  --frame:#d8dfd9;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  --math:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; /* 算式：减号不会显示成“一” */
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--frame);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default;opacity:.4}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:1280px;height:720px;background:var(--paper2);overflow:hidden;border-radius:10px;box-shadow:0 20px 60px #1d352a30;transform-origin:center center}
html.is-full #stage{border-radius:0;box-shadow:none}
#confetti{position:absolute;inset:0;z-index:60;pointer-events:none}

/* ===== 幻灯片与分步出现 ===== */
.slide{position:absolute;left:0;top:0;width:1280px;height:676px;padding:0 64px;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.slide.active{opacity:1;visibility:visible;transition:opacity .35s ease}
.notes{display:none}
[data-build]{transition:opacity .45s ease,transform .45s ease}
[data-build]:not(.hl){opacity:0;transform:translateY(10px);pointer-events:none}
[data-build].shown:not(.hl){opacity:1;transform:none;pointer-events:auto}
.gone{opacity:0!important;transition:opacity .3s!important}

/* ===== 页眉、标题胶囊（同书本） ===== */
.lhead{height:52px;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:9px;border-bottom:1px solid #b5c1b8;font-size:15px;letter-spacing:.05em;color:#33443d}
.lhead b{color:var(--teal)}
.lhead span:last-child{color:#7b8a80}
.heading{display:flex;align-items:center;gap:16px;height:60px;margin:16px 0 12px}
.pill{position:relative;margin:0 0 0 8px;padding:5px 22px 7px 30px;background:#ffedc5;border-radius:6px;box-shadow:2px 3px 0 #d9d6c3;font:900 30px/1.2 var(--sans);letter-spacing:.08em;color:#2b3a33;transform:rotate(-2deg);white-space:nowrap}
.pill .clip{position:absolute;left:-9px;top:-6px;width:25px;height:36px}
.tag{padding:5px 14px;border-radius:8px;background:#f8e8cf;color:#225e50;font-weight:700;font-size:19px;letter-spacing:.04em;white-space:nowrap}
.tag.lv{background:#e8f0e4}
.tag.x{background:#efe9f6;color:#5b5480}
.stepper{margin-left:auto;display:flex;gap:6px}
.stepper button{border:0;font-size:15px;padding:6px 12px;border-radius:999px;color:#7d8b82;background:#eef1ea;white-space:nowrap}
.stepper button:hover{background:#e2ebdf}
.stepper button.on{background:var(--leaf);color:#fff}
.head-right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ===== 页脚：进度、小组积分、工具 ===== */
#folio{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 14px 0 24px;border-top:1px solid #d3dbd0;background:#f5f5ee;font-size:14px;color:#6a7e72;z-index:30}
#f-section{flex:none;width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
#teams{display:flex;gap:6px;align-items:center;flex:none}
.team{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border:1px solid #d6ddd2;border-radius:999px;background:#fff;font-size:13px;color:#3f5a4c;user-select:none}
.team i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.team b{font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.team:hover{border-color:var(--c);background:#fffdf6}
.team-set{width:30px;height:30px;padding:0;border:1px dashed #c9d3c9;border-radius:50%;background:none;color:#7c8c81;font-size:15px}
.many-teams #f-section{display:none}
.many-teams .team span{max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-weight:800;color:var(--c,#d77a50);font-size:16px;pointer-events:none;animation:popup .9s ease-out forwards;white-space:nowrap}
@keyframes popup{to{transform:translate(-50%,-34px);opacity:0}}
#f-progress{position:relative;flex:1;min-width:60px;height:6px;border-radius:3px;background:#dfe5dc;cursor:pointer}
#f-progress i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--leaf);transition:width .3s}
.f-tools{display:flex;gap:6px;align-items:center;flex:none}
.f-tools button{height:30px;padding:0 10px;border:1px solid #cfd8cd;border-radius:7px;background:#fff;color:#3f5a4c;font-size:13px;display:flex;align-items:center;gap:4px}
.f-tools button svg{width:16px;height:16px}
.f-tools button:hover:not(:disabled){background:#eef4ec}
.f-tools button.on{background:#e3efe0;border-color:var(--leaf)}
#f-page{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;color:#3f5a4c;font-weight:600}
#btn-prev,#btn-next{width:40px;padding:0!important;font-size:20px!important;justify-content:center}
#btn-next{position:relative;background:var(--leaf)!important;color:#fff!important;border-color:var(--leaf)!important}
#btn-next:hover:not(:disabled){background:var(--green-d)!important}
#btn-next .left{position:absolute;top:-9px;right:-9px;min-width:19px;height:19px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;line-height:19px;padding:0 5px;font-weight:700}

/* ===== 通用按钮 ===== */
.btn-primary{height:54px;padding:0 26px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:20px;font-weight:700;box-shadow:0 6px 16px #2f6e4b33}
.btn-primary:hover{background:var(--green-d)}
.btn-soft{height:54px;padding:0 22px;border:1.5px solid #bcd0c1;border-radius:12px;background:#fff;color:#2f5f4a;font-size:19px}
.btn-soft:hover{background:#f0f6ee}
.chip-btn{height:38px;padding:0 14px;border:1.5px solid #cfd8cd;border-radius:10px;background:#fff;color:#2f5f4a;font-size:16px}
.chip-btn:hover{background:#eef4ec}
.chip-btn.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}

/* ===== 封面 ===== */
.slide.cover{padding:0}
.cv-left{position:absolute;left:76px;top:42px;width:600px}
.cv-mast{display:flex;justify-content:space-between;font-size:14px;letter-spacing:.18em;color:#5b7a69;padding-bottom:14px;border-bottom:1px solid #b9c9bd}
.cv-mast b{color:var(--teal)}
.cv-chapter{display:flex;align-items:baseline;gap:14px;margin-top:30px}
.cv-chapter small{font:600 13px var(--sans);letter-spacing:.3em;color:var(--tan)}
.cv-chapter b{font:700 84px/1 Georgia,"Times New Roman",serif;color:#c49a6c}
.cv-chapter span{font-size:20px;letter-spacing:.2em;color:#8a6a4c}
.cv-eye{margin:22px 0 4px;font-size:15px;letter-spacing:.32em;color:var(--tan)}
.cover h1{margin:0;font:700 64px/1.3 var(--serif);letter-spacing:.08em;color:#26463b}
.cover h2{margin:2px 0 0;font:500 40px/1.35 var(--serif);letter-spacing:.14em;color:var(--green)}
.cv-accent{width:76px;height:6px;border-radius:3px;background:#c49a6c;margin:24px 0 20px}
.cv-keys{display:flex;gap:12px;margin:0;padding:0;list-style:none}
.cv-keys li{padding:7px 16px;border:1.5px solid #c5d6c8;border-radius:999px;font-size:18px;color:#3c6a55;background:#f4f8f1}
.cv-start{display:flex;gap:14px;align-items:center;margin-top:36px}
.cv-art{position:absolute;right:60px;top:30px;width:468px;height:606px;border-radius:160px 12px 140px 12px;overflow:hidden;background:#eef1e6;box-shadow:0 14px 34px #33503f26}
.cv-art img{width:100%;height:100%;object-fit:cover;display:block}
.cv-badge{position:absolute;right:84px;top:52px;padding:6px 14px;border-radius:999px;background:#fffdf8e6;color:#2f5f4a;font-size:14px;letter-spacing:.12em;box-shadow:0 2px 8px #0001}

/* ===== 本讲路线 ===== */
.route{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rcol{background:#fff;border:1px solid #e1e6dc;border-radius:18px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 14px #2c4a3a0d}
.rhead{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px dashed #d7dfd3}
.rhead>b{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font:700 23px Georgia,serif}
.rhead strong{display:block;font-size:23px;color:#28463a}
.rhead small{font-size:15px;color:#7a877f}
.rhead svg{margin-left:auto;width:76px;height:30px;flex:none}
.rcard{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--leaf);background:#f1f8ef;text-align:left;font:inherit;transition:transform .2s,box-shadow .2s}
.rcard .no{font-size:15px;font-weight:700;color:#8a6a4c;background:#f8e8cf;border-radius:6px;padding:3px 8px;white-space:nowrap}
.rcard strong{font-size:22px;color:#2c3b34;white-space:nowrap}
.rcard em{margin-left:auto;font-style:normal;font-size:13px;color:#fff;background:var(--leaf);padding:4px 10px;border-radius:999px;white-space:nowrap}
.rcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px #2f6e4b22}
.rfoot{display:flex;gap:16px;margin-top:18px}
.flow,.rlinks{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid #e1e6dc;font-size:16px;color:#7a877f;white-space:nowrap}
.flow b,.rlinks b{color:#2f5f4a;margin-right:4px}
.flow span{padding:4px 10px;border-radius:8px;background:#eef4ec;color:#2f5f4a}
.rlinks{flex:1}
.rlinks button{border:0;padding:5px 12px;border-radius:8px;background:#f8e8cf;color:#7a5a3c;font-size:16px}
.rlinks button:hover{background:#f3dcb8}
.map-talk{display:flex;align-items:center;gap:16px;margin-top:18px}
.map-talk img{width:118px;height:98px;object-fit:contain;flex:none}
.map-talk .say{flex:none;padding:12px 20px;border-radius:16px;background:#fff0c9;border:1px solid #dfd3a8;font-size:19px;line-height:1.5}
.map-talk .say b{display:block;font-size:15px;color:#8f5a3e}
.kformula{margin-left:auto;padding:12px 20px;border-radius:12px;background:#f7dfc6;font-size:18px;font-weight:700;color:#5b3d26;line-height:1.6;text-align:center}

/* ===== 热身：电闪雷鸣 + 魔法三角 ===== */
.warm-grid{display:grid;grid-template-columns:1fr 440px;gap:28px}
.storm{position:relative;height:250px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#3b4a63,#55688a 60%,#7d8fa8);color:#fff;padding:22px 26px}
.storm h3{margin:0;font:700 30px/1.4 var(--serif);letter-spacing:.06em}
.storm p{margin:8px 0 0;font-size:20px;line-height:1.6;opacity:.92}
.bolt{position:absolute;right:46px;top:26px;width:92px;height:150px;filter:drop-shadow(0 0 14px #ffe58a);animation:flash 3.2s infinite}
@keyframes flash{0%,62%,70%,100%{opacity:1}64%,68%{opacity:.2}}
.cloud{position:absolute;right:16px;top:-10px;width:200px;height:70px;border-radius:40px;background:#9aa8bc;box-shadow:-60px 18px 0 -6px #8796ad,50px 22px 0 -10px #8796ad}
.storm .reveal{position:absolute;left:26px;right:26px;bottom:18px;padding:12px 16px;border-radius:14px;background:#fffdf8;color:var(--ink);font-size:19px;line-height:1.55}
.storm .reveal b{color:var(--orange-d)}
.quick{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.quick li{list-style:none;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:14px;background:#fff;border:1px solid #e1e6dc;font-size:21px}
.quick li i{flex:none;font-style:normal;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#267b60;color:#fff;font:700 17px Georgia,serif}
.quick .qa{margin-left:auto;font-weight:700;color:var(--orange-d);font-family:var(--math);white-space:nowrap}
.quick ul{margin:0;padding:0}
.tri-box{background:#fff;border:1px solid #e1e6dc;border-radius:20px;padding:16px 18px;text-align:center}
.tri-box h3{margin:0 0 4px;font:700 24px var(--serif);color:#1d6852}
.tri-box p{margin:0;color:#7a877f;font-size:15px}
.tri{width:330px;height:270px;margin:8px auto 0;display:block}
.tri .cell{cursor:pointer}
.tri .cell polygon{fill:#f7f3e8;stroke:#c9b48f;stroke-width:2;transition:fill .25s}
.tri .cell:hover polygon{fill:#fff2d6}
.tri .cell.cover polygon{fill:#4c8d61;stroke:#2f6e4b}
.tri .cell text{font:800 30px var(--sans);fill:#5b3d26;pointer-events:none}
.tri .cell.cover text{fill:#fff}
.tri .op{font:800 34px var(--math);fill:#9e7350}
.tri-out{margin-top:6px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#f7dfc6;font-size:24px;font-weight:700;color:#5b3d26;font-family:var(--math)}

/* ===== 知识梳理 ===== */
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.kcard{background:#fff;border:1px solid #e1e6dc;border-radius:18px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:8px}
.kcard .khead{display:flex;align-items:center;gap:10px;color:#165c67;font-size:21px;font-weight:700}
.kcard .khead b{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#267b60;color:#fff;font:700 18px Georgia,serif;flex:none}
.kcard p{margin:0;font-size:17px;line-height:1.6;color:#45524b}
.kanim{height:96px;border-radius:12px;background:#f7f8f2;position:relative;overflow:hidden}
.kanim .road{position:absolute;left:14px;right:14px;top:58px;height:6px;border-radius:3px;background:#e4dcc6}
.kanim .dot{position:absolute;top:36px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
.kanim .dg{background:var(--green)}.kanim .db{background:var(--blue)}
.kanim .lbl{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:15px;font-weight:700;color:var(--orange-d)}
.k1 .dg{animation:k1a 3.4s ease-in-out infinite}.k1 .db{animation:k1b 3.4s ease-in-out infinite}
@keyframes k1a{0%,10%{left:14px}60%,100%{left:calc(50% - 30px)}}
@keyframes k1b{0%,10%{left:calc(100% - 44px)}60%,100%{left:50%}}
.k2 .dg{animation:k2a 3.4s ease-in-out infinite}.k2 .db{animation:k2b 3.4s ease-in-out infinite}
@keyframes k2a{0%,10%{left:14px}75%,100%{left:calc(100% - 50px)}}
@keyframes k2b{0%,10%{left:42%}75%,100%{left:calc(100% - 46px)}}
.k3 .tlx{position:absolute;left:14px;right:14px;top:22px;display:flex;justify-content:space-between}
.k3 .tlx span{padding:5px 10px;border-radius:999px;background:#eef1ea;color:#7f8c84;font-size:14px;animation:k3 4s infinite}
.k3 .tlx span:nth-child(2){animation-delay:1s}.k3 .tlx span:nth-child(3){animation-delay:2s}.k3 .tlx span:nth-child(4){animation-delay:3s}
@keyframes k3{0%,20%{background:var(--leaf);color:#fff}25%,100%{background:#eef1ea;color:#7f8c84}}
.k3 .road{top:64px}
.kbottom{display:flex;align-items:center;gap:18px;margin-top:16px}
.kbottom img{width:120px;height:100px;object-fit:contain;flex:none}
.kbottom .say{padding:12px 20px;border-radius:16px;background:#fff0c9;border:1px solid #dfd3a8;font-size:19px;line-height:1.5}
.kbottom .say b{display:block;font-size:15px;color:#8f5a3e}

/* ===== 小游戏：速度和还是速度差 ===== */
.sort-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:4px}
.basket{position:relative;min-height:200px;border-radius:20px;border:3px dashed;padding:12px 14px 14px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;transition:background .2s,transform .2s}
.basket h3{width:100%;margin:0 0 4px;display:flex;align-items:center;gap:10px;font:800 24px var(--sans)}
.basket h3 small{font:500 15px var(--sans);color:#7a877f}
.basket.sum{border-color:#e3b597;background:#fff8f2}.basket.sum h3{color:var(--orange-d)}
.basket.diff{border-color:#a9c7d6;background:#f3f9fb}.basket.diff h3{color:var(--blue-d)}
.basket.over{transform:scale(1.02);background:#fffbe5}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;min-height:120px;align-content:flex-start}
.scard{position:relative;max-width:350px;padding:10px 14px;border-radius:12px;background:#fff;border:1.5px solid #d6ddd2;box-shadow:0 3px 8px #2c4a3a14;font-size:18px;line-height:1.45;cursor:grab;touch-action:none;user-select:none;transition:box-shadow .2s,transform .2s}
.scard:hover{box-shadow:0 6px 14px #2c4a3a22}
.scard.sel{border-color:var(--leaf);box-shadow:0 0 0 3px #5d987e55}
.scard.drag{cursor:grabbing;box-shadow:0 14px 28px #2c4a3a33;transform:rotate(-2deg);z-index:20}
.scard.done{cursor:default;font-size:15px;padding:6px 10px;border-color:transparent;background:#ffffffcc}
.scard.done::after{content:"✓";margin-left:6px;color:var(--green);font-weight:800}
.scard.no{animation:shake .4s}
.sort-msg{margin-top:10px;min-height:30px;font-size:19px;color:var(--green-d)}
.sort-score{display:flex;gap:10px;align-items:center}

/* ===== 例题 · 审题 ===== */
.ex-title{font:700 26px/1.4 var(--sans);color:#256f60;margin:0 0 6px}
.stem{font:400 29px/1.78 var(--sans);margin:0;color:#2b3530;text-align:justify}
.stem.long{font-size:27px;line-height:1.7}
.stem mark{color:inherit;padding:0 2px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;background-color:transparent;background-repeat:no-repeat;background-size:0% 100%;transition:background-size .8s ease}
.stem mark.shown{background-size:100% 100%}
.m-total{background-image:linear-gradient(transparent 50%,#ffcdb0 50%)}
.m-jia{background-image:linear-gradient(transparent 50%,#c5e2c4 50%)}
.m-yi{background-image:linear-gradient(transparent 50%,#c2dcee 50%)}
.kw{border-radius:7px;-webkit-box-decoration-break:clone;box-decoration-break:clone;box-shadow:0 0 0 2.5px transparent;transition:box-shadow .4s}
.kw.shown{box-shadow:0 0 0 2.5px var(--orange)}
.ask{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:9px;transition:text-decoration-color .4s,color .4s}
.ask.shown{text-decoration-color:var(--violet);color:#4b4470}
.read-row{display:flex;gap:22px;margin-top:14px;align-items:stretch}
.scene{position:relative;height:187px;margin:0;flex:none}
.scene img{height:100%;width:auto;display:block;border-radius:10px}
.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scene .lab{font:800 30px var(--sans);fill:#fff}
.scene .dim{font:700 30px var(--sans);fill:var(--orange-d)}
.think{flex:1;display:flex;align-items:flex-end;gap:8px;padding:14px 8px 0 18px;background:var(--note);border:1px solid var(--note-line);border-radius:16px;box-shadow:0 3px 0 #eadcb2;min-width:0}
.think .bulb{width:36px;height:48px;flex:none;align-self:flex-start;margin-top:4px}
.think-text{flex:1;align-self:center;font-size:22px;line-height:1.6;padding-bottom:12px}
.think-text strong{display:block;font-size:23px;margin-bottom:2px}
.think-text ol{margin:0;padding-left:1.25em}
.think img{width:150px;height:158px;object-fit:contain;object-position:bottom;flex:none}
.answer-row{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:24px;color:#33443d;white-space:nowrap;flex-wrap:nowrap}
.answer-row.many{font-size:20px;gap:8px}
.ar-label{font-size:16px;font-weight:700;color:#fff;background:var(--leaf);padding:5px 12px;border-radius:8px;transform:rotate(-3deg)}
.ans{width:104px;height:52px;border:2px dashed #9db8a6;border-radius:10px;background:#fff;text-align:center;font:700 28px var(--math);color:var(--ink);outline:none}
.answer-row.many .ans{width:78px;height:46px;font-size:24px}
.ans:focus{border-style:solid;border-color:var(--green)}
.ans.right{border:2px solid var(--green);background:#eef8ec;color:var(--green-d)}
.ans.wrong{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.btn-check{height:52px;padding:0 22px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:20px;font-weight:700;position:relative;flex:none}
.btn-check:hover{background:var(--green-d)}
.feedback{font-size:19px;line-height:1.45;white-space:normal;min-width:0;flex:1;margin:0}
.feedback.ok{color:var(--green-d)}
.feedback.bad{color:var(--orange-d)}
.feedback>b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:15px;margin-right:4px;vertical-align:2px}
.feedback.ok>b{background:var(--green)}
.feedback.bad>b{background:var(--orange)}
.award{display:inline-flex;gap:6px;margin-left:8px;vertical-align:1px}
.award button{height:28px;padding:0 10px;border:1px solid var(--c);border-radius:999px;background:#fff;color:var(--c);font-size:14px;font-weight:700}
.award button:hover{background:var(--c);color:#fff}
.spark{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* ===== 动画演示（相遇/追及模拟器） ===== */
.sim{display:flex;flex-direction:column;gap:8px}
.sim-top{display:flex;align-items:center;gap:10px;height:42px}
.sim-phases,.sim-tabs{display:flex;gap:8px;flex:none}
.sim-phases span{padding:7px 14px;border-radius:999px;background:#eef1ea;color:#7f8c84;font-size:16px;white-space:nowrap;transition:background .3s,color .3s,box-shadow .3s}
.sim-phases span.on{background:var(--leaf);color:#fff;box-shadow:0 3px 10px #5d987e40}
.sim-phases span.meet.on{background:var(--orange);box-shadow:0 3px 10px #d77a5040}
.sim-tabs button{height:38px;padding:0 16px;border:1.5px solid #cfd8cd;border-radius:999px;background:#fff;font-size:16px;color:#3f5a4c}
.sim-tabs button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.sim-say{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;padding:6px 16px 6px 10px;border-radius:14px;background:#fff3cf;border:1px solid #ecd9a2;font-size:18px;color:#5a4a1f;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.sim-say.show{opacity:1;transform:none}
.sim-say svg{width:22px;height:29px;flex:none}
.sim-say p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-stage{position:relative;background:#fffefa;border:1px solid #e3e5da;border-radius:14px;overflow:hidden}
.sim-svg{display:block;width:100%;height:auto;touch-action:none}
.sim-svg text{font-family:var(--sans)}
.sim-svg .rl{font-size:15px;fill:#8a968e;font-family:var(--math)}
.sim-svg .rl.end{font-weight:700;fill:#5d6b62}
.sim-svg .endl{font-size:19px;font-weight:800;fill:#4a5a51}
.sim-svg .tagt{font-size:17px;font-weight:700;fill:#fff}
.sim-svg .gapt{font-size:20px;font-weight:700;fill:var(--orange-d)}
.sim-svg .bt{font-size:18px;font-weight:700}
.sim-svg .meett{font-size:21px;font-weight:800;fill:var(--orange-d)}
.sim-svg .evn{font-size:13px;font-weight:800;fill:#fff}
.sim-svg .legend{font-size:13px;fill:#9aa59d}
.sim-svg .guess{cursor:ew-resize}
.sim-svg .guesst{font-size:17px;font-weight:800;fill:#746d96}
.sim-read{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.rd{background:#fff;border:1px solid #e3e6dd;border-radius:12px;padding:6px 12px 7px;min-width:0}
.rd span{display:block;font-size:13px;color:#7c887f;white-space:nowrap}
.rd b{font-size:27px;line-height:1.2;font-variant-numeric:tabular-nums;color:#2d3833;font-family:var(--math)}
.rd b.wait{font-size:19px;color:#a3ada6;font-weight:600;font-family:var(--sans)}
.rd i{font-style:normal;font-size:14px;color:#7c887f;margin-left:3px}
.rd small{display:block;font-size:13px;color:#9aa49c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd.g b{color:var(--green-d)} .rd.b b{color:var(--blue-d)} .rd.o b{color:var(--orange-d)} .rd.p b{color:#b2513a}
.rd.v{background:#fff6ee;border-color:#f1dccb}
.rd.v b{color:var(--orange-d)}
.rd.wide{grid-column:span 2}
.rd.wide3{grid-column:span 3}
.rd.ev .log{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px;min-height:26px}
.rd.ev .log em{font-style:normal;font-size:14px;padding:2px 8px;border-radius:999px;background:#eef4ec;color:#2f5f4a;white-space:nowrap}
.rd.ev .log em.now{background:var(--orange);color:#fff}
.rd.cnt b{font-size:34px;color:#b2513a}
.rd.param input{width:100%;accent-color:var(--blue);margin:6px 0 0}
.rd.param b{font-size:22px;color:var(--blue-d)}
.sim-bar{display:flex;align-items:center;gap:8px;height:58px}
.sim-bar>button{height:42px;border:1px solid #cfd8cd;border-radius:10px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:16px;color:#2f5f4a;flex:none;white-space:nowrap}
.sim-bar>button:hover{background:#eef4ec}
.sim-bar>button.on{background:#efecf7;border-color:var(--violet);color:#4b4470}
.sim-bar .sb-play{background:var(--green);border-color:var(--green);color:#fff;min-width:100px;justify-content:center;font-weight:700}
.sim-bar .sb-play:hover{background:var(--green-d)}
.sim-bar .ic{width:18px;height:18px}
.tl{position:relative;flex:1;height:54px;min-width:0}
.tl input{-webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;top:2px;width:100%;height:26px;margin:0;background:transparent;--p:0%}
.tl input:focus{outline:none}
.tl input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--leaf) var(--p),#e1e6dc var(--p))}
.tl input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid var(--green);box-shadow:0 1px 4px #0003}
.tl input::-moz-range-track{height:8px;border-radius:4px;background:#e1e6dc}
.tl input::-moz-range-progress{height:8px;border-radius:4px;background:var(--leaf)}
.tl input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--green)}
.tl-keys button{position:absolute;top:28px;transform:translateX(-50%);border:0;background:none;padding:2px 4px;font-size:13px;color:#7c887f;white-space:nowrap;line-height:1.2}
.tl-keys button::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:8px;background:#b8c3ba;transform:translateX(-50%)}
.tl-keys button.first{transform:none}
.tl-keys button.first::before{left:9px}
.tl-keys button.last{transform:translateX(-100%)}
.tl-keys button.last::before{left:auto;right:9px}
.tl-keys button:hover{color:var(--green-d)}
.tl-keys b{font-weight:700;color:#4f6a5b}
.tl-dead{position:absolute;top:-2px;height:14px;border-left:3px solid #c0563a;pointer-events:none}
.tl-dead span{position:absolute;left:4px;top:-17px;font-size:12px;font-weight:700;color:#c0563a;white-space:nowrap}
.sb-speed{display:flex;border:1px solid #cfd8cd;border-radius:10px;overflow:hidden;flex:none}
.sb-speed button{border:0;background:#fff;height:40px;padding:0 11px;font-size:15px;color:#4f6a5b}
.sb-speed button+button{border-left:1px solid #e1e6dc}
.sb-speed button.on{background:#e3efe0;color:var(--green-d);font-weight:700}
.sb-auto{display:flex;align-items:center;gap:5px;font-size:14px;color:#4f6a5b;white-space:nowrap;cursor:pointer;flex:none}
.sb-auto input{width:17px;height:17px;accent-color:var(--green);margin:0}

/* ===== 线段图 + 分步解答 ===== */
.segfig{display:block;width:100%;height:auto;margin-top:-6px}
.segfig text{font-family:var(--math)}
.segfig .t{font-size:20px}
.segfig .s{font-size:17px}
.segfig .strong{font-weight:700}
.segfig .tdim{font-size:23px;font-weight:700;fill:#4a5a51}
.segfig .tname{font-size:26px;font-weight:800}
.segfig .g{fill:var(--green-d);stroke:var(--green)}
.segfig .b{fill:var(--blue-d);stroke:var(--blue)}
.segfig .o{fill:var(--orange-d);stroke:var(--orange)}
.segfig .v{fill:#5b5480;stroke:var(--violet)}
.segfig .r{fill:#c0563a}
.segfig .k{fill:#4a5a51}
.segfig text.g,.segfig text.b,.segfig text.o,.segfig text.v{stroke:none}
.segfig .dimline{stroke:#7d8b82;stroke-width:2}
.segfig .guide{stroke:#b9c3bb;stroke-width:1.5;stroke-dasharray:5 6}
.segfig .main{stroke:#56645c;stroke-width:4;stroke-linecap:round}
.segfig .endt{stroke:#56645c;stroke-width:3}
.segfig .seg{stroke-width:10;stroke-linecap:round;fill:none}
.segfig .seg.g2{stroke:#8cc09a}
.segfig .tick{stroke-width:3}
.segfig .brace{fill:none;stroke-width:3;stroke-linecap:round}
.segfig .arrow{stroke-width:4;fill:none}
.segfig .pole{stroke:#c0563a;stroke-width:3}
.segfig .flag{fill:#e07a4f;stroke:none}
.segfig .box{fill:#fff;stroke:#d9dfd4;stroke-width:2}
.segfig .boxo{fill:#fff6ee;stroke:#e3b597;stroke-width:2}
.segfig .barg{fill:#a7cfa9;stroke:var(--green);stroke-width:2}
.segfig .barb{fill:#a9c9da;stroke:var(--blue);stroke-width:2}
.segfig .bard{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 5}
.segfig .ovl{fill:#f6c7ab88;stroke:var(--orange);stroke-width:2;stroke-dasharray:6 4}
.solve{display:grid;grid-template-columns:1fr 420px;gap:22px;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;align-items:center;gap:12px;height:54px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid #e3e6dd}
.steps.five{gap:6px}
.steps.five li{height:45px}
.steps .sn{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#267b60;color:#fff;font-weight:700;font-size:17px}
.steps .q{flex:none;width:300px;font-size:19px;color:#55665c;line-height:1.3}
.eqbox{position:relative;flex:1;height:44px;display:flex;align-items:center;min-width:0}
.eq{font-size:27px;font-weight:700;color:#24332c;font-variant-numeric:tabular-nums;white-space:nowrap}
.steps.five .eq{font-size:25px}
.eq em{font-style:normal;color:var(--orange-d)}
.ph{position:absolute;left:0;top:50%;transform:translateY(-50%);padding:6px 16px;border:2px dashed #c9d4c8;border-radius:10px;color:#a0aba3;font-size:16px;cursor:pointer;transition:opacity .3s;background:#fafbf7}
.ph:hover{border-color:var(--leaf);color:var(--leaf)}
.eq.shown+.ph{opacity:0;pointer-events:none}
.sv-side{display:flex;flex-direction:column;gap:6px}
.ans-card{display:flex;align-items:center;gap:12px;padding:8px 16px;border-radius:12px;background:#e9f4e6;border:1.5px solid #b9d8bd;font-size:21px;font-weight:600;color:#24432f}
.ans-card.sm{font-size:18px}
.ans-card b{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:17px}
.ans-card em{font-style:normal;font-size:28px;color:var(--orange-d);padding:0 2px;font-family:var(--math)}
.combo,.verify{padding:8px 16px 9px;border-radius:12px;background:#fff;border:1px solid #e3e6dd;font-size:19px;line-height:1.5;font-variant-numeric:tabular-nums}
.combo small,.verify small{display:inline-block;font-size:13px;color:#fff;background:var(--tan);border-radius:5px;padding:1px 8px;margin-bottom:2px;letter-spacing:.06em}
.verify small{background:var(--blue)}
.combo p,.verify p{margin:0;white-space:nowrap}
.verify .ok{color:var(--green-d);font-weight:700}
.eq,.combo p,.verify p,.pr-sol li,.kf,.three span{font-family:var(--math)}

/* ===== 知识小结 ===== */
.sum-grid{display:grid;grid-template-columns:460px 1fr;gap:26px}
.sum-talk{position:relative;height:520px;background:#f3f6ec;border:1px solid #c9ddca;border-radius:20px;overflow:hidden}
.sum-talk img{position:absolute;left:30px;right:30px;bottom:0;width:400px;height:310px;object-fit:contain;object-position:bottom}
.bub{position:absolute;padding:10px 16px;border-radius:18px;background:#fff;border:1.5px solid #cfe0cf;font-size:19px;line-height:1.5;box-shadow:0 4px 12px #2c4a3a14}
.bub b{display:block;font-size:15px;color:#8f5a3e;margin-bottom:2px}
.bub::after{content:"";position:absolute;bottom:-11px;width:18px;height:18px;background:#fff;border-right:1.5px solid #cfe0cf;border-bottom:1.5px solid #cfe0cf}
.bub.b1{left:18px;top:20px;max-width:196px}
.bub.b1::after{left:58px;transform:rotate(45deg)}
.bub.b2{right:18px;top:20px;max-width:222px}
.bub.b2::after{right:70px;transform:rotate(45deg)}
.sum-card{display:flex;flex-direction:column;gap:12px}
.sum-card h3{margin:0;display:flex;align-items:center;gap:10px;font:700 28px/1.3 var(--serif);color:#1d6852}
.sum-card h3 small{font:500 15px var(--sans);color:#7a877f;letter-spacing:.06em}
.three{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.three li{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid #e1e6dc}
.three li>i{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:#267b60;color:#fff;font:700 21px Georgia,serif;font-style:normal}
.three b{display:block;font-size:22px;color:#24432f}
.three span{font-size:18px;color:#66756b}
.kf{padding:12px 18px;border-radius:12px;background:#f7dfc6;font-size:23px;font-weight:700;color:#5b3d26;text-align:center}
.pit{padding:12px 18px;border-radius:14px;background:#fff6ee;border:1.5px dashed #e3b597}
.pit b{display:inline-block;font-size:15px;color:#fff;background:var(--orange);border-radius:6px;padding:2px 10px;margin-bottom:4px}
.pit p{margin:3px 0;font-size:19px;line-height:1.5;color:#6b4a35}

/* ===== 课堂练习 / 闯关 / 拓展 ===== */
.pr-card{display:flex;gap:18px;align-items:flex-start;padding:18px 22px;border-radius:16px;background:#fff;border:1px solid #e1e6dc;box-shadow:0 4px 14px #2c4a3a0d}
.pr-no{flex:none;padding:4px 12px;border-radius:8px;background:#267b60;color:#fff;font:700 22px Georgia,serif;white-space:nowrap}
.pr-no.lvA{background:#4c8d61}.pr-no.lvB{background:#4f87a3}.pr-no.lvC{background:#746d96}.pr-no.lvX{background:#b2513a;font-family:var(--sans);font-size:19px}
.pr-text{margin:0;font-size:28px;line-height:1.72;text-align:justify}
.pr-text.long{font-size:25px;line-height:1.66}
.slide.practice .answer-row{margin-top:16px}
.pr-tools{display:flex;gap:10px;margin-top:14px;align-items:center}
.pr-tools button{height:44px;padding:0 18px;border:1.5px solid #cfd8cd;border-radius:11px;background:#fff;font-size:18px;color:#2f5f4a;display:flex;align-items:center;gap:7px}
.pr-tools button:hover{background:#eef4ec}
.pr-tools button.on{background:#e3efe0;border-color:var(--leaf)}
.pr-tools svg{width:18px;height:18px}
.qstars{margin-left:auto;display:flex;gap:4px;font-size:30px;line-height:1;color:#ddd6c3}
.qstars i{font-style:normal;transition:color .3s,transform .3s}
.qstars i.on{color:#f0b429;transform:scale(1.15);text-shadow:0 2px 6px #f0b42966}
.pr-panels{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:14px;align-items:start}
.pr-hint,.pr-sol{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none}
.pr-hint.open,.pr-sol.open{opacity:1;transform:none;pointer-events:auto}
.pr-hint{padding:14px 18px;border-radius:14px;background:var(--note);border:1px solid var(--note-line);font-size:20px;line-height:1.6}
.pr-hint b{display:block;font-size:16px;color:#8f5a3e}
.pr-sol{padding:12px 18px;border-radius:14px;background:#fff;border:1px solid #e1e6dc}
.pr-sol ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.pr-sol li{font-size:20px;line-height:1.55;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-sol li span{color:#7a877f;font-size:16px;margin-right:6px}
.pr-sol .full{grid-column:1/-1}
.pr-sol .final{grid-column:1/-1;margin-top:4px;padding-top:6px;border-top:1px dashed #d7dfd3;font-weight:700;color:#24432f;white-space:normal}
.pr-deco{position:absolute;right:64px;bottom:0;width:150px;height:158px;object-fit:contain;object-position:bottom;opacity:.95;pointer-events:none;transition:opacity .3s}
.slide.practice.solving .pr-deco{opacity:0}

/* ===== 闯关地图 ===== */
.quest{position:relative;height:520px;border-radius:22px;background:linear-gradient(180deg,#eef5ea,#f8f3e4);border:1px solid #dfe6d9;overflow:hidden}
.quest svg.path{position:absolute;inset:0;width:100%;height:100%}
.qlevel{position:absolute;width:300px;padding:16px 18px;border-radius:20px;background:#fff;border:2px solid var(--c);box-shadow:0 8px 20px #2c4a3a14}
.qlevel h3{margin:0 0 10px;display:flex;align-items:center;gap:10px;font:800 24px var(--sans);color:var(--c)}
.qlevel h3 b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;font:700 22px Georgia,serif}
.qlevel h3 em{margin-left:auto;font-style:normal;font-size:14px;color:#fff;background:#f0b429;border-radius:999px;padding:3px 10px;opacity:0;transform:scale(.6);transition:all .4s}
.qlevel.clear h3 em{opacity:1;transform:none}
.qnode{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px 12px;border-radius:12px;border:1.5px solid #e1e6dc;background:#fbfbf7;font-size:19px;text-align:left}
.qnode:hover{border-color:var(--c);background:#fffdf6}
.qnode span{flex:1}
.qnode i{font-style:normal;letter-spacing:2px;color:#ddd6c3;font-size:20px}
.qnode i b{color:#f0b429;font-weight:400}
.qtotal{position:absolute;right:26px;bottom:22px;display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:16px;background:#fff;border:1px solid #e1e6dc;font-size:20px}
.qtotal b{font-size:34px;color:#f0b429;font-family:var(--math)}
.qtotal button{height:34px;padding:0 12px;border:1px solid #d6ddd2;border-radius:8px;background:#fff;font-size:14px;color:#7c8c81}
.quest .flagpole{position:absolute;right:64px;top:40px;font-size:15px;color:#7a877f;text-align:center}

/* ===== 终总 ===== */
.final-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fcard{padding:14px 16px;border-radius:16px;background:#fff;border:1px solid #e1e6dc;display:flex;flex-direction:column;gap:6px}
.fcard h4{margin:0;display:flex;align-items:center;gap:8px;font-size:21px;color:#24432f}
.fcard h4 i{font-style:normal;font-size:14px;color:#fff;background:#267b60;border-radius:6px;padding:2px 8px}
.fcard p{margin:0;font-size:17px;line-height:1.55;color:#55665c}
.fcard .ff{font-family:var(--math);font-weight:700;color:var(--orange-d);font-size:18px}
.froute{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;padding:14px;border-radius:16px;background:#f7dfc6;font-size:21px;font-weight:700;color:#5b3d26}
.froute span{padding:6px 14px;border-radius:10px;background:#fffdf8}

/* ===== 实验室 ===== */
.lab-ctrl{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:8px}
.lab-box{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid #e1e6dc;font-size:14px;color:#55665c;white-space:nowrap;min-width:0}
.lab-box b{font-size:16px}
.lab-box input[type=range]{flex:1 1 70px;min-width:40px;width:70px}
.lab-box output{min-width:46px;font-weight:700;font-family:var(--math);color:#24432f;font-size:13px}
.lab-box .dirb{height:30px;padding:0 10px;border:1px solid #cfd8cd;border-radius:8px;background:#fff;font-size:15px}
.lab-box.g b{color:var(--green-d)}.lab-box.b b{color:var(--blue-d)}
.lab-box.g input{accent-color:var(--green)}.lab-box.b input{accent-color:var(--blue)}

/* ===== 颁奖典礼 ===== */
.award-wrap{display:grid;grid-template-columns:1fr 360px;gap:24px;height:540px}
.podium{position:relative;border-radius:22px;background:radial-gradient(circle at 50% 20%,#fff6dc,#f3ead2 60%,#eadfc3);border:1px solid #e3d6b4;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:16px;padding:0 30px}
.pod{width:170px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .who{font-size:22px;font-weight:800;color:#3b3a2e}
.pod .st{font-size:20px;color:#b98a17;font-weight:700}
.pod .crown{font-size:38px;line-height:1}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:#fff;font:800 30px Georgia,serif;height:46px;transition:height 1.1s cubic-bezier(.2,.8,.2,1.1)}
.podium.go .pod.r1 .blk{height:260px}.podium.go .pod.r2 .blk{height:190px}.podium.go .pod.r3 .blk{height:140px}.podium.go .pod.r4 .blk{height:100px}
.pod.r1 .blk{background:linear-gradient(#f0b429,#d99a12)}.pod.r2 .blk{background:linear-gradient(#a9b6bd,#8796a0)}.pod.r3 .blk{background:linear-gradient(#d39a6a,#b97c4d)}.pod.r4 .blk{background:linear-gradient(#a7c3a8,#86a789)}
.pod .crown{opacity:0;transform:translateY(10px);transition:all .5s ease 1s}
.podium.go .pod .crown{opacity:1;transform:none}
.award-side{display:flex;flex-direction:column;gap:12px}
.award-card{padding:16px 18px;border-radius:18px;background:#fff;border:1px solid #e1e6dc}
.award-card h4{margin:0 0 6px;font:700 20px var(--serif);color:#1d6852}
.award-card p{margin:2px 0;font-size:17px;line-height:1.6;color:#55665c}
.award-card .big{font-size:40px;font-weight:800;color:#f0b429;font-family:var(--math)}

/* ===== 浮层：目录 / 备注 / 动画弹窗 / 提示 / 计时器 / 小组设置 ===== */
.overlay{position:absolute;inset:0 0 44px;z-index:40;background:#1e2c2580;display:flex;align-items:center;justify-content:center}
.ix-box{width:1120px;max-height:600px;overflow:auto;background:var(--paper);border-radius:18px;padding:18px 24px;box-shadow:0 20px 60px #0004}
.ix-box h3{margin:0 0 10px;font:700 24px var(--serif);color:#1d6852}
.ix-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ix-col h5{margin:0 0 6px;font-size:15px;color:#8f5a3e;letter-spacing:.06em}
.ix-col button{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:5px;padding:6px 8px;border:1px solid #e1e6dc;border-radius:9px;background:#fff;text-align:left;font-size:14px}
.ix-col button:hover,.ix-col button.on{border-color:var(--leaf);background:#f1f8ef}
.ix-col i{font-style:normal;min-width:24px;height:22px;border-radius:6px;display:grid;place-items:center;background:#eef1ea;color:#4f6a5b;font-size:12px;font-weight:700;flex:none}
#notes{position:absolute;left:24px;right:24px;bottom:56px;z-index:35;padding:14px 20px 16px;border-radius:14px;background:#22352cf2;color:#eef5ef;box-shadow:0 10px 30px #0003}
#notes h4{margin:0 0 6px;font-size:14px;letter-spacing:.12em;color:#a9cdb5}
#nt-body{font-size:17px;line-height:1.65}
#nt-body p{margin:2px 0}
#nt-body b{color:#ffd99a}
.md-box{width:1220px;background:var(--paper);border-radius:18px;padding:14px 22px 10px;box-shadow:0 20px 60px #0004}
.md-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.md-head b{font:700 22px var(--serif);color:#1d6852}
.md-head button{width:40px;height:40px;border:1px solid #cfd8cd;border-radius:10px;background:#fff;font-size:24px;line-height:1}
#toast{position:absolute;left:50%;bottom:64px;z-index:50;transform:translate(-50%,10px);padding:10px 20px;border-radius:12px;background:#22352cee;color:#fff;font-size:17px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#timer{position:absolute;right:18px;top:62px;z-index:45;width:236px;padding:12px 14px 12px;border-radius:18px;background:#fffdf8;border:1px solid #d9dfd4;box-shadow:0 12px 30px #1d352a33}
#timer.ring{animation:shake .5s 3}
#timer .tm-top{display:flex;align-items:center;gap:12px}
#timer svg{width:84px;height:84px;flex:none}
#timer .tm-txt{font:800 34px var(--math);color:#24432f;font-variant-numeric:tabular-nums}
#timer .tm-lbl{font-size:13px;color:#7a877f}
#timer .tm-row{display:flex;gap:6px;margin-top:8px}
#timer .tm-row button{flex:1;height:30px;border:1px solid #cfd8cd;border-radius:8px;background:#fff;font-size:13px;color:#2f5f4a}
#timer .tm-row button.on{background:#e3efe0;border-color:var(--leaf)}
#timer .tm-x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;color:#9aa49c}
#team-panel{position:absolute;left:180px;bottom:52px;z-index:45;width:330px;padding:14px 16px;border-radius:16px;background:#fffdf8;border:1px solid #d9dfd4;box-shadow:0 12px 30px #1d352a33}
#team-panel h4{margin:0 0 8px;font:700 18px var(--serif);color:#1d6852}
#team-panel .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#team-panel .row i{width:14px;height:14px;border-radius:50%;flex:none}
#team-panel .row input{flex:1;height:32px;padding:0 10px;border:1px solid #cfd8cd;border-radius:8px;font:16px var(--sans)}
#team-panel .row b{min-width:44px;text-align:right;color:#b98a17}
#team-panel .ops{display:flex;gap:6px;margin-top:10px}
#team-panel .ops button{flex:1;height:32px;border:1px solid #cfd8cd;border-radius:8px;background:#fff;font-size:14px;color:#2f5f4a}
#team-panel p{margin:8px 0 0;font-size:13px;color:#7a877f;line-height:1.5}

/* =====================================================================
   以下为工具包新增组件（第11讲起）
   ===================================================================== */
/* 页面容器 */
#slides{position:absolute;inset:0}
.rcol .rcard+.rcard{margin-top:0}
.route.n2{grid-template-columns:repeat(2,1fr)}
.route.n4{grid-template-columns:repeat(4,1fr)}
.route.n4 .rcard strong{font-size:19px}

/* 动画：火车、车头车尾标记、窗口观察者 */
.sim-svg .ht{font-size:13px;font-weight:700;fill:#fff}
.sim-svg .stl{font-size:22px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#00000033;stroke-width:3}
.sim-svg .stl2{font-size:19px;font-weight:700;fill:#5d6b62}
.sim-svg .trv{font-size:20px;font-weight:800;fill:var(--violet)}
.sim-svg .trs{font-size:16px;font-weight:700}
.sim-svg .draghint{font-size:14px;fill:#9aa59d}
.sim-svg .agent-drag{cursor:grab}
.rd.st b{font-size:20px;font-family:var(--sans);color:#4b4470}
.rd.st{background:#f5f2fb;border-color:#e2dcf0}

/* 线段图里的火车 */
.segfig .trbody{stroke-width:2}
.segfig .trg{fill:#a7cfa9;stroke:var(--green)}
.segfig .trb{fill:#a9c9da;stroke:var(--blue)}
.segfig .trs{fill:#c9b08a;stroke:#8a6a4c}
.segfig .tun{fill:#b9c9a3;stroke:#7d9a6a;stroke-width:2}
.segfig .brg{fill:none;stroke:#a08a6a;stroke-width:3}
.segfig .riv{fill:#cfe5ef}
.segfig .pole{stroke:#7d6a55;stroke-width:4}
.segfig .w{fill:#fff;stroke:none}

/* 知识梳理：自定义小动画卡片 */
.kanim.svg{height:110px;background:#f7f8f2}
.kanim.svg svg{width:100%;height:100%;display:block}
.kmove{animation:kmove 4.2s ease-in-out infinite}
@keyframes kmove{0%,12%{transform:translateX(0)}70%,100%{transform:translateX(var(--d))}}
.kshow{animation:kshow 4.2s ease-in-out infinite}
@keyframes kshow{0%,62%{opacity:0}72%,100%{opacity:1}}

/* 连连看 */
.match-wrap{position:relative;display:grid;grid-template-columns:1fr 180px 1fr;gap:0;margin-top:6px}
.match-col{display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.mcard{min-height:58px;padding:10px 16px;border-radius:14px;background:#fff;border:2px solid #d6ddd2;box-shadow:0 3px 8px #2c4a3a12;font-size:19px;line-height:1.45;text-align:left;font-family:var(--sans);color:var(--ink);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 14px #2c4a3a22}
.mcard.sel{border-color:var(--violet);box-shadow:0 0 0 4px #746d9640;background:#f7f5fc}
.mcard.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);cursor:default;transform:none}
.mcard.no{animation:shake .4s}
.match-col.right .mcard{font-family:var(--math);font-weight:700;color:#5b3d26;background:#fffaf2}
.match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.match-bar{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:18px;color:#55665c}
.match-bar b{font-family:var(--math);color:var(--green-d)}

/* 抢答闯关 */
.buzz{display:grid;grid-template-columns:1fr 300px;gap:22px}
.bz-card{position:relative;height:440px;border-radius:24px;background:#fff;border:1px solid #e1e6dc;box-shadow:0 10px 30px #2c4a3a14;padding:26px 32px;display:flex;flex-direction:column;perspective:1200px}
.bz-no{display:flex;align-items:center;gap:10px;font-size:18px;color:#8f5a3e;font-weight:700}
.bz-no i{font-style:normal;padding:3px 12px;border-radius:999px;background:#f8e8cf}
.bz-q{flex:1;display:flex;align-items:center;font-size:34px;line-height:1.6;font-weight:600;color:#24332c;animation:flipin .5s ease}
@keyframes flipin{from{opacity:0;transform:rotateX(-50deg) translateY(20px)}to{opacity:1;transform:none}}
.bz-a{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:16px;background:#e9f4e6;border:1.5px solid #b9d8bd;font-size:26px;font-weight:700;color:#24432f;font-family:var(--math);opacity:0;transform:scale(.9);transition:all .35s}
.bz-a.show{opacity:1;transform:none}
.bz-a b{font-family:var(--sans);font-size:16px;color:#fff;background:var(--green);border-radius:8px;padding:3px 10px}
.bz-side{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.bz-ring{position:relative;width:210px;height:210px;margin:0 auto}
.bz-ring svg{width:100%;height:100%}
.bz-ring .num{position:absolute;inset:0;display:grid;place-items:center;font:800 64px var(--math);color:#24432f}
.bz-ring.hot .num{color:#c0563a;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.bz-btns{display:flex;flex-direction:column;gap:8px}
.bz-btns .btn-primary,.bz-btns .btn-soft{height:48px;font-size:18px}
.bz-award{display:flex;flex-wrap:wrap;gap:8px}
.bz-award button{flex:1;height:42px;border:2px solid var(--c);border-radius:12px;background:#fff;color:var(--c);font-size:16px;font-weight:700}
.bz-award button:hover{background:var(--c);color:#fff}
.bz-dots{display:flex;gap:6px;justify-content:center}
.bz-dots i{width:12px;height:12px;border-radius:50%;background:#dfe5dc}
.bz-dots i.on{background:var(--leaf)}.bz-dots i.cur{background:var(--orange);transform:scale(1.3)}

/* 幸运转盘 */
#wheel{position:absolute;inset:0 0 44px;z-index:42;background:#1e2c25a8;display:flex;align-items:center;justify-content:center;gap:40px}
.wh-box{position:relative;width:500px;height:500px}
.wh-disc{width:500px;height:500px;border-radius:50%;box-shadow:0 0 0 10px #fffdf8,0 20px 50px #0005;transition:transform 4.6s cubic-bezier(.12,.75,.12,1)}
.wh-pin{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:44px solid #c0563a;filter:drop-shadow(0 3px 3px #0004);z-index:2}
.wh-hub{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:#fffdf8;border:6px solid #c49a6c;display:grid;place-items:center;font:800 22px var(--sans);color:#5b3d26;cursor:pointer;z-index:2}
.wh-hub:hover{background:#fff6e6}
.wh-panel{width:330px;padding:18px 20px;border-radius:20px;background:#fffdf8;box-shadow:0 20px 50px #0004}
.wh-panel h3{margin:0 0 8px;font:700 24px var(--serif);color:#1d6852}
.wh-res{min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:16px;background:#fff6e6;border:2px dashed #e3c38f;font:800 34px var(--sans);color:#b2513a;padding:8px;margin-bottom:10px}
.wh-res.result-pop{animation:popres .5s ease}
@keyframes popres{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.wh-panel label{display:block;font-size:14px;color:#7a877f;margin:8px 0 4px}
.wh-panel textarea{width:100%;height:84px;border:1px solid #cfd8cd;border-radius:10px;padding:8px;font:15px/1.5 var(--sans);resize:none}
.wh-row{display:flex;gap:8px;margin-top:8px}
.wh-row button{flex:1;height:38px;border:1px solid #cfd8cd;border-radius:10px;background:#fff;font-size:15px;color:#2f5f4a}
.wh-row button.on{background:#e3efe0;border-color:var(--leaf)}
.wh-x{position:absolute;right:24px;top:20px;width:44px;height:44px;border:0;border-radius:12px;background:#fffdf8;font-size:26px}

/* 实验室（通用参数面板） */
.lab-ctrl.gen{display:flex;flex-wrap:wrap;gap:8px}
.lab-ctrl.gen .lab-box{flex:1 1 200px}
.lab-box select{height:30px;border:1px solid #cfd8cd;border-radius:8px;font:14px var(--sans);background:#fff}
.wh-panel input[type=number]{width:100%;height:34px;border:1px solid #cfd8cd;border-radius:10px;padding:0 10px;font:15px var(--sans)}
.ix-cols{grid-template-columns:repeat(6,1fr)}

/* ===== 第13讲起：通用小部件外框 ===== */
.wd{display:flex;flex-direction:column;gap:8px}
.wd-title{flex:none;font:700 19px var(--sans);color:#2f5f4a;padding:7px 16px;border-radius:999px;background:#e7f2e4;white-space:nowrap}
.wd .sim-say{opacity:1;transform:none;max-width:760px}
.wd .sim-say p{white-space:normal;line-height:1.35}
.wd .sim-bar{height:54px}
.wd .sim-bar>button{height:44px;font-size:17px}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.3)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
@keyframes lineIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:none}40%{transform:translateY(-12px)}}
@keyframes roll{0%{transform:translateY(-16px);opacity:.15}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}

/* ===== 整除侦探 ===== */
.dv-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;height:424px}
.dv-left{display:flex;flex-direction:column;gap:6px;min-width:0;overflow:hidden}
.dv-tab{border-collapse:separate;border-spacing:0 6px}
.dv-tab th{font:700 16px var(--sans);color:#55665c;padding:0 4px;text-align:center;white-space:nowrap}
.dv-tab thead th{height:26px}
.dv-num{height:46px;min-width:120px;padding:0 12px;border:1.5px solid #d6ddd2;border-radius:10px;background:#fff;font:700 24px var(--math);color:#2d3833}
.dv-num.sel{border-color:var(--orange);background:#fff6ee;color:var(--orange-d)}
.dv-cell{position:relative;width:104px;height:46px;margin:0 3px;border:2px dashed #c9d3c7;border-radius:10px;background:#fbfbf7;font:800 26px var(--math);color:#b5beb7}
.dv-cell::before{content:"?";opacity:.55}
.dv-cell.g-y::before{content:"✓";opacity:1;color:var(--blue)}
.dv-cell.g-n::before{content:"✗";opacity:1;color:var(--blue)}
.dv-cell.rv{border-style:solid}
.dv-cell.rv.t-y{background:#e7f2e4;border-color:var(--green)}
.dv-cell.rv.t-y::before{content:"✓";color:var(--green-d);opacity:1}
.dv-cell.rv.t-n{background:#fbeee6;border-color:#dfa688}
.dv-cell.rv.t-n::before{content:"✗";color:var(--orange-d);opacity:1}
.dv-cell.miss{box-shadow:0 0 0 3px #d77a50;animation:shake .4s}
.dv-cell.miss::after,.dv-cell.hit::after{position:absolute;right:3px;top:-10px;font:700 12px var(--sans);color:#fff;border-radius:6px;padding:1px 5px}
.dv-cell.hit::after{content:"猜对";background:#f0b429}
.dv-cell.miss::after{content:"猜错";background:var(--orange)}
.dv-cell.sel{outline:3px solid #efc85b;outline-offset:2px}
.dv-tab.dense{border-spacing:0 4px}
.dv-tab.dense .dv-num,.dv-tab.dense .dv-cell{height:42px}
.dv-legend{margin:2px 0 0;font-size:15px;color:#7a877f;white-space:nowrap}
.dv-legend b{font-family:var(--math)}
.dv-legend .y,.dv-legend .n{color:var(--blue)}
.dv-board{position:relative;border-radius:18px;background:#fffefa;border:1px solid #e3e5da;padding:14px 18px;overflow:hidden;min-width:0}
.dv-q{font-size:22px;color:#2d3833;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dv-q b{font-family:var(--math);color:var(--teal)}
.dv-m{margin-left:8px;font-size:15px;color:#fff;background:var(--violet);padding:3px 10px;border-radius:999px}
.dv-tiles{display:flex;align-items:center;justify-content:center;gap:6px;margin:20px 0 30px;min-height:84px}
.dv-tiles i{position:relative;flex:none;width:var(--tw,64px);height:calc(var(--tw,64px)*1.25);display:grid;place-items:center;border-radius:12px;background:#fff;border:2px solid #d6ddd2;font:800 calc(var(--tw,64px)*.7) var(--math);font-style:normal;color:#2d3833;transition:all .45s}
.dv-tiles i.dim{opacity:.3}
.dv-tiles i.hot{background:#fde9dc;border-color:var(--orange);color:var(--orange-d);transform:translateY(-10px);box-shadow:0 8px 16px #d77a5033}
.dv-tiles i.sum{background:#fff6d8;border-color:#e3b63f;color:#8a6412;animation:bob .6s}
.dv-tiles i.odd{background:#e7f2e4;border-color:var(--green);color:var(--green-d)}
.dv-tiles i.even{background:#e4f0f6;border-color:var(--blue);color:var(--blue-d)}
.dv-tiles i.seg{background:#efecf7;border-color:var(--violet);color:#4b4470}
.dv-tiles i.seg2{background:#fdf1e2;border-color:#d8a45c;color:#8a5a1c}
.dv-tiles i[data-sub]:not([data-sub=""])::after{content:attr(data-sub);position:absolute;bottom:-25px;font:700 15px var(--sans)}
.dv-tiles s{flex:none;width:0;height:calc(var(--tw,64px)*1.4);border-radius:3px;background:#b45c36;opacity:0;margin:0 -3px;transition:all .35s}
.dv-tiles s.on{width:5px;opacity:1;margin:0 6px}
.dv-lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;max-width:calc(100% - 118px)}
.dv-lines li{font:500 21px/1.4 var(--math);color:#33443d;animation:lineIn .4s ease}
.dv-lines li b{color:var(--orange-d)}
.dv-lines em{font-style:normal;font-weight:800}
.dv-lines em.y{color:var(--green-d)}.dv-lines em.n{color:var(--orange-d)}
.c-odd,.c-even{font-style:normal;font-weight:700}
.c-odd{color:var(--green-d)}.c-even{color:var(--blue-d)}
.dv-stamp{position:absolute;right:20px;top:58px;padding:6px 16px;border:5px solid;border-radius:14px;font:900 28px var(--sans);letter-spacing:.08em;opacity:0;pointer-events:none;white-space:nowrap}
.dv-stamp.show{opacity:1;transform:rotate(-12deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
.dv-stamp.y{color:var(--green-d);border-color:var(--green);background:#e7f2e4e6}
.dv-stamp.n{color:#b2513a;border-color:#d77a50;background:#fbeee6e6}
.dv-det{position:absolute;right:6px;bottom:0;height:148px;width:auto;pointer-events:none}
.dv-score{margin-left:auto;font-size:17px;color:#55665c;white-space:nowrap}
.dv-score b{color:var(--orange-d);font-family:var(--math)}
.dv-body.free{grid-template-columns:400px minmax(0,1fr)}
.dv-left.free{gap:14px;padding:4px 2px}
.dv-inbox{display:flex;align-items:center;gap:10px;font-size:17px;color:#55665c;white-space:nowrap}
.dv-in{width:200px;height:56px;border:2px solid #9db8a6;border-radius:12px;text-align:center;font:800 28px var(--math);color:var(--ink);outline:none}
.dv-in:focus{border-color:var(--orange)}
.dv-ds{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.dv-ds b{width:100%;font-size:15px;color:#7a877f;font-weight:500}
.dv-ds button{height:42px;min-width:64px;padding:0 10px;border:1.5px solid #cfd8cd;border-radius:10px;background:#fff;font:700 19px var(--math);color:#2f5f4a}
.dv-ds button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.dv-all{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dv-all span{padding:4px 9px;border-radius:8px;font:700 16px var(--math);animation:grow .35s both}
.dv-all span.y{background:#e7f2e4;color:var(--green-d)}.dv-all span.n{background:#f1efe9;color:#a3ada6}

/* ===== 密码保险箱 ===== */
.sf-body{display:grid;grid-template-columns:650px minmax(0,1fr);gap:16px;height:424px}
.sf-box{position:relative;border-radius:22px;background:linear-gradient(160deg,#6a8a77,#3f5a4c);box-shadow:inset 0 2px 0 #ffffff40,0 10px 24px #2c4a3a40;padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px}
.sf-plate{align-self:center;padding:5px 18px;border-radius:8px;background:#efe7d2;color:#4a3a2a;font:700 17px var(--sans);box-shadow:inset 0 -2px 0 #0002;white-space:nowrap}
.sf-code{display:flex;justify-content:center;align-items:center;gap:8px;padding:26px 12px 10px;border-radius:16px;background:#2c3e35;box-shadow:inset 0 4px 12px #0007}
.sf-t{position:relative;width:64px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;transition:box-shadow .25s}
.sf-t.fx{background:#d6ddd3;box-shadow:inset 0 -3px 0 #0002}
.sf-t b{font:800 54px/1 var(--math);color:#2d3833}
.sf-t.dl{background:#fffdf5;box-shadow:0 0 0 3px #efc85b}
.sf-t.dl b{color:#b45c36;cursor:pointer;user-select:none}
.sf-t button{width:100%;height:30px;border:0;background:none;color:#8a958d;font-size:18px;line-height:1;padding:0}
.sf-t button:hover{color:var(--orange-d)}
.sf-t em{position:absolute;top:-23px;font:700 15px var(--sans);font-style:normal;color:#f3e6c4}
.sf-t.hl{box-shadow:0 0 0 4px #ff9f5a}
.sf-t.roll b{animation:roll .25s}
.sf-low{display:flex;gap:16px;align-items:stretch;flex:1;min-height:0}
.sf-door{position:relative;flex:1;border-radius:14px;background:#22302a;perspective:900px}
.sf-inside{position:absolute;inset:6px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:10px;background:radial-gradient(circle,#fff6d0,#ecc35a)}
.sf-gold{font:900 40px var(--math);color:#7a4d10;letter-spacing:.04em}
.sf-coin{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4b8,#e0a82e 60%,#a8741a);box-shadow:0 2px 0 #8a5a12}
.sf-panel{position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,#86a291,#55715f);box-shadow:inset 0 0 0 3px #ffffff2a,inset 0 -6px 0 #0002;transform-origin:left center;transition:transform .9s cubic-bezier(.3,1.25,.5,1);display:grid;place-items:center;backface-visibility:hidden}
.sf.open .sf-panel{transform:rotateY(-108deg)}
.sf-panel svg{width:58px;height:58px}
.sf-wheel{width:118px;height:118px;flex:none;align-self:center}
.sf-spk{transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.sf-side{display:flex;flex-direction:column;gap:9px;min-width:0}
.sf-side h4{margin:0;font-size:18px;color:#2f5f4a}
.sf-lamps{display:flex;flex-direction:column;gap:8px}
.sf-lamp{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid #e1e6dc}
.sf-lamp>i{flex:none;width:26px;height:26px;border-radius:50%;background:#d6d2c8;box-shadow:inset 0 -3px 0 #0002;transition:background .3s,box-shadow .3s}
.sf-lamp.on>i{background:#5cc27a;box-shadow:0 0 12px #5cc27a,inset 0 -3px 0 #0002}
.sf-lamp>div{min-width:0}
.sf-lamp b{display:block;font-size:17px;color:#2d3833}
.sf-lamp span{display:block;font:15px/1.35 var(--math);color:#8a958d}
.sf-lamp.on span{color:var(--green-d)}
.sf-found{margin-top:auto;padding:10px 12px;border-radius:12px;background:#fff8e6;border:1px solid #ecd9a2}
.sf-fh{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;color:#8a6412}
.sf-fh span{font:800 22px var(--math)}
.sf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:32px}
.sf-chips i{font:700 17px var(--math);font-style:normal;padding:3px 9px;border-radius:8px;background:#fff;border:1.5px solid #e3b63f;color:#7a4d10;animation:grow .35s}
.sf-stat{margin-left:auto;font-size:16px;color:#55665c;white-space:nowrap}

/* ===== 读心术 ===== */
.mg-body{position:relative;display:flex;flex-direction:column;gap:18px;height:424px;padding:18px 22px;border-radius:18px;background:#fffefa;border:1px solid #e3e5da;overflow:hidden}
.mg-row1{display:flex;align-items:center;gap:16px}
.mg-pick{display:flex;align-items:center;gap:10px;font-size:20px;color:#55665c;white-space:nowrap}
.mg-in{width:118px;height:64px;border:2px solid #9db8a6;border-radius:12px;text-align:center;font:800 38px var(--math);color:var(--ink);outline:none}
.mg-arrow{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;color:#7a877f;white-space:nowrap}
.mg-arrow i{position:relative;width:110px;height:4px;border-radius:2px;background:#c9b48f}
.mg-arrow i::after{content:"";position:absolute;right:-4px;top:-6px;border:8px solid transparent;border-left:12px solid #c9b48f}
.mg-num{min-width:118px;height:72px;display:grid;place-items:center;padding:0 16px;border-radius:14px;background:#fff;border:2px dashed #d6ddd2;font:800 40px var(--math);color:#2d3833;letter-spacing:.04em;transition:border-color .3s,background .3s}
.mg-num.on,.mg-step.on .mg-num{border-style:solid;border-color:var(--orange);background:#fff6ee;color:var(--orange-d);animation:grow .5s}
.mg-row2{display:flex;align-items:center;gap:6px}
.mg-step{display:flex;align-items:center;gap:6px;opacity:.38;transition:opacity .4s}
.mg-step.on{opacity:1}
.mg-to{width:22px;height:4px;border-radius:2px;background:#c9b48f}
.mg-mach{width:92px;height:92px;flex:none;border-radius:20px;background:linear-gradient(160deg,#86a291,#55715f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;box-shadow:0 6px 14px #2c4a3a33}
.mg-mach b{font:800 23px var(--math)}
.mg-mach svg{width:34px;height:34px}
.mg-mach.run{animation:shake .5s}
.mg-mach.run svg{animation:spin .9s ease-out}
.mg-step .mg-num{min-width:0;font-size:34px;height:64px}
.mg-wow{position:absolute;right:30px;top:116px;padding:8px 18px;border-radius:999px;background:#f0b429;color:#fff;font:800 24px var(--sans);opacity:0;transform:scale(.4) rotate(-8deg);transition:all .4s cubic-bezier(.2,1.6,.4,1)}
.mg-wow.on{opacity:1;transform:rotate(-8deg)}
.mg-secret{padding:12px 18px;border-radius:16px;background:#f7dfc6;color:#5b3d26;opacity:0;transform:translateY(12px);transition:all .5s}
.mg-secret.on{opacity:1;transform:none}
.mg-secret b{display:inline-block;font-size:15px;color:#fff;background:var(--orange);border-radius:6px;padding:2px 10px}
.mg-secret p{margin:6px 0 0;font-size:20px;line-height:1.5}
.mg-secret span{display:inline-block;margin-right:26px;font:800 26px var(--math)}

/* ===== 点选答案、多值答案 ===== */
.pick{display:flex;gap:16px;align-items:flex-start;margin-top:14px}
.pk-rows{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.pk-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pk-lab{flex:none;min-width:136px;font-size:17px;font-weight:700;color:#2f5f4a;white-space:nowrap}
.pk-chip{height:40px;padding:0 12px;border:1.5px solid #cfd8cd;border-radius:10px;background:#fff;font:700 20px var(--math);color:#2d3833;transition:background .2s,border-color .2s}
.pk-chip:hover{border-color:var(--blue)}
.pk-chip.on{background:#e4f0f6;border-color:var(--blue);color:var(--blue-d)}
.pk-chip.right{background:#e7f2e4;border-color:var(--green);color:var(--green-d)}
.pk-chip.wrong{background:#fbeee6;border-color:var(--orange);color:var(--orange-d);animation:shake .4s}
.pk-chip.miss{border:2px dashed var(--orange)}
.pk-bar{flex:none;width:330px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.pk-bar .feedback{flex-basis:100%}
.answer-row.lst .ans{width:300px;font-size:22px;text-align:left;padding:0 12px}
.answer-row.lst.two .ans{width:250px}
.answer-row.lst .ans::placeholder{font:400 15px var(--sans);color:#a3ada6}

/* ===== 线段图里的数字卡片 ===== */
.dg{fill:#fff;stroke:#c9d3c7;stroke-width:2}
.dg.dg-o{fill:#fde9dc;stroke:#d77a50}.dg.dg-g{fill:#e7f2e4;stroke:#4c8d61}.dg.dg-b{fill:#e4f0f6;stroke:#4f87a3}.dg.dg-v{fill:#efecf7;stroke:#746d96}.dg.dg-y{fill:#fff6d8;stroke:#e3b63f}
.dg.q{stroke-dasharray:7 5;fill:#fffbe8;stroke:#d8a45c}
.dg.dim{opacity:.45}
.dgt{font-family:var(--math);font-weight:800;fill:#2d3833}
.dgt.dgt-o{fill:#b45c36}.dgt.dgt-g{fill:#2f6e4b}.dgt.dgt-b{fill:#33698a}.dgt.dgt-v{fill:#4b4470}.dgt.dgt-y{fill:#8a6412}.dgt.q{fill:#c08a3a}
.dgsep{stroke:#b45c36;stroke-width:4;stroke-linecap:round}
.dscene{background:#fffefa;border:1px solid #e3e5da;border-radius:12px}
.dscene svg,.kanim.svg svg{font-family:var(--math)}
.dscene .t,.kanim .t{font-size:19px}.dscene .s,.kanim .s{font-size:15px}
.dscene .strong,.kanim .strong{font-weight:700}
.dscene .g,.kanim .g{fill:var(--green-d);stroke:var(--green)}.dscene .b,.kanim .b{fill:var(--blue-d);stroke:var(--blue)}
.dscene .o,.kanim .o{fill:var(--orange-d);stroke:var(--orange)}.dscene .v,.kanim .v{fill:#5b5480;stroke:var(--violet)}.dscene .k,.kanim .k{fill:#4a5a51}
.dscene .brace,.kanim .brace{fill:none;stroke-width:2.5}
.dscene text.t,.dscene text.s,.kanim text.t,.kanim text.s{stroke:none}

/* ===== 分类篮子：三、四个篮子 ===== */
.sort-wrap.n3{grid-template-columns:repeat(3,1fr)}
.sort-wrap.n4{grid-template-columns:repeat(4,1fr)}
.basket.b3{border-color:#c5bfdc;background:#f6f4fb}.basket.b3 h3{color:#5b5480}
.basket.b4{border-color:#cdd6c9;background:#f6f8f3}.basket.b4 h3{color:#56645c}
.sort-wrap.n3 .basket,.sort-wrap.n4 .basket{min-height:250px}
.sort-wrap.n3 .basket h3,.sort-wrap.n4 .basket h3{font-size:21px;flex-wrap:wrap;gap:2px 8px}

/* 知识梳理：四张卡片 */
.kgrid.n4{grid-template-columns:repeat(4,1fr);gap:14px}
.kgrid.n4 .kcard{padding:14px 14px 12px}
.kgrid.n4 .kcard .khead{font-size:20px}
.kgrid.n4 .kcard p{font-size:16px;line-height:1.55}

/* ===== 第14讲起：分身有几个 ===== */
.rc-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;height:424px}
.rc-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.rc-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rc-pick label{display:flex;align-items:center;gap:8px;margin-left:8px;font-size:15px;color:#55665c}
.rc-pick input{width:150px;accent-color:var(--orange)}
.rc-pick output{min-width:28px;font:700 18px var(--math);color:var(--orange-d)}
.rc-area{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-end;gap:16px 24px;padding:14px;border-radius:16px;background:#fffefa;border:1px solid #e3e5da;overflow:hidden}
.rc-r{margin:0;opacity:0;transform:translateY(10px) scale(.92);transition:opacity .4s,transform .4s}
.rc-r.on{opacity:1;transform:none}
.rc-g{display:grid;gap:2px}
.rc-g i{background:#f0c25a;border-radius:3px;box-shadow:inset 0 -2px 0 #0002}
.rc-r figcaption{text-align:center;font:700 16px var(--math);color:#55665c;margin-top:5px}
.rc-side{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid #e1e6dc;overflow:hidden}
.rc-n{font-size:18px;color:#55665c}.rc-n b{font:800 46px var(--math);color:var(--teal);margin-right:6px}
.rc-f{font:600 19px/1.5 var(--math);color:#2d3833}.rc-f small{display:block;font:500 15px var(--sans);color:#7a877f}
.rc-v{align-self:flex-start;padding:8px 16px;border-radius:12px;font:800 21px var(--sans)}
.rc-v.p{background:#e7f2e4;color:var(--green-d)}.rc-v.c{background:#fbeee6;color:var(--orange-d)}.rc-v.one{background:#eef1ea;color:#7a877f}
.rc-deco{position:absolute;right:6px;bottom:0;height:130px;width:auto;pointer-events:none}

/* ===== 埃拉托色尼筛法 ===== */
.sv-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;height:424px}
.sv-grid{display:grid;grid-template-columns:repeat(10,50px);grid-auto-rows:38px;gap:4px}
.sv-c{position:relative;padding:0;border:1.5px solid #dfe5dc;border-radius:8px;background:#fff;font:700 18px var(--math);color:#2d3833;transition:background .25s,color .25s,border-color .25s}
.sv-c.x{color:#bfc7c0;background:#f6f5f0;border-color:#e6e4dc}
.sv-c.x::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--c);transform:rotate(-22deg)}
.sv-c.keep{border:3px solid var(--c);border-radius:999px;color:var(--c);background:#fff}
.sv-c.pr{background:#fff6d8;border-color:#e3b63f;color:#8a6412;box-shadow:0 0 0 2px #f0c25a55}
.sv-c.pr.keep{border-color:var(--c);color:var(--c)}
.sv-c.flash{box-shadow:0 0 0 3px #b2513a;animation:pulse .35s 6 alternate}
.sv-c.bad{box-shadow:0 0 0 3px var(--orange);animation:shake .4s}
.sv-c.miss{outline:2px dashed var(--orange);outline-offset:-5px}
.sv-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.sv-steps{display:flex;flex-direction:column;gap:7px}
.sv-b{height:40px;border:1.5px solid #cfd8cd;border-left:7px solid var(--c,#9aa59d);border-radius:10px;background:#fff;text-align:left;padding:0 14px;font-size:17px;color:#2f5f4a}
.sv-b:hover{background:#f3f8f1}
.sv-b.done{background:#eef4ec;color:#7a877f}
.sv-b.done::after{content:" ✓";color:var(--green-d);font-weight:800}
.sv-11{--c:#b2513a}
.sv-count{display:flex;gap:10px}
.sv-count div{flex:1;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid #e1e6dc}
.sv-count span{display:block;font-size:13px;color:#7c887f}
.sv-count b{font:800 30px var(--math);color:var(--teal)}
.sv-own{display:flex;gap:8px;align-items:center}
.sv-tip{margin-left:auto;font-size:14px;color:#9aa59d;white-space:nowrap}
.sv-stat{margin-left:auto;font-size:17px;font-weight:700;color:#8a6412;white-space:nowrap}

/* ===== 质数检测站 ===== */
.tr-body{display:flex;flex-direction:column;gap:10px;height:424px}
.tr-nums{display:flex;flex-wrap:wrap;gap:8px}
.tr-nums button{position:relative;height:42px;min-width:70px;padding:0 14px;border:1.5px solid #cfd8cd;border-radius:10px;background:#fff;font:700 20px var(--math);color:#2d3833}
.tr-nums button.on{border-color:var(--violet);box-shadow:0 0 0 3px #746d9633}
.tr-nums button i{position:absolute;right:2px;top:-10px;font:700 12px var(--sans);font-style:normal;color:#fff;border-radius:6px;padding:1px 5px}
.tr-nums button i:empty{display:none}
.tr-nums .isp i{background:var(--green)}.tr-nums .isc i{background:var(--orange)}
.tr-main{position:relative;flex:1;min-height:0;border-radius:18px;background:#fffefa;border:1px solid #e3e5da;padding:12px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.tr-head{display:flex;align-items:center;gap:16px}
.tr-n b{font:800 50px var(--math);color:var(--teal)}
.tr-n span{font-size:22px;color:#55665c;margin-left:10px}
.tr-guess{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:16px;color:#7a877f}
.tr-guess button{height:38px;padding:0 14px;border:1.5px solid #cfd8cd;border-radius:10px;background:#fff;font-size:17px;color:#2f5f4a}
.tr-guess button.on{background:#e4f0f6;border-color:var(--blue);color:var(--blue-d)}
.tr-guess button.right{background:#e7f2e4;border-color:var(--green);color:var(--green-d)}
.tr-guess button.wrong{background:#fbeee6;border-color:var(--orange);color:var(--orange-d)}
.tr-sq{align-self:flex-start;padding:8px 14px;border-radius:12px;background:#f3f6ec;font:500 20px var(--math);color:#55665c}
.tr-sq b{color:var(--orange-d)}
.tr-gates{display:flex;flex-wrap:wrap;gap:10px}
.tr-g{width:130px;padding:8px 6px;border-radius:14px;border:2px dashed #c9d3c7;background:#fff;text-align:center;transition:all .35s}
.tr-g b{display:block;font:800 30px var(--math);color:#55665c}
.tr-g span{display:block;min-height:18px;font:500 12px var(--math);color:#9aa59d;white-space:nowrap}
.tr-g.pass{border-style:solid;border-color:var(--green);background:#e7f2e4}
.tr-g.pass b,.tr-g.pass span{color:var(--green-d)}
.tr-g.catch{border-style:solid;border-color:var(--orange);background:#fbeee6;animation:shake .4s}
.tr-g.catch b{color:var(--orange-d)}.tr-g.catch span{color:var(--orange-d);font-weight:700}
.tr-res{align-self:flex-start;display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:14px;opacity:0;transform:scale(.9);transition:opacity .35s,transform .35s}
.tr-res.show{opacity:1;transform:none}
.tr-res b{font:900 30px var(--sans)}
.tr-res span{font:600 20px var(--math)}
.tr-res.y{background:#e7f2e4;color:var(--green-d)}.tr-res.n{background:#fbeee6;color:#b2513a}
.tr-deco{position:absolute;right:10px;bottom:0;height:140px;width:auto;pointer-events:none}
.tr-stat{margin-left:auto;font-size:16px;color:#55665c;white-space:nowrap}

/* ===== 拆数机 ===== */
.fc-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;height:424px}
.fc-left{display:flex;flex-direction:column;gap:8px;min-width:0}
.fc-modes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fc-modes .on{background:var(--violet);border-color:var(--violet);color:#fff}
.fc-in{width:140px;height:40px;border:2px solid #9db8a6;border-radius:10px;text-align:center;font:800 22px var(--math);color:var(--ink);outline:none}
.fc-stage{flex:1;min-height:0;border-radius:18px;background:#fffefa;border:1px solid #e3e5da;overflow:hidden;display:flex;align-items:center;justify-content:center}

function renderDiagram(d){

  const P0=d.px?d.px[0]:90,P1=d.px?d.px[1]:1110,x0=d.x0||0,L=d.L,X=m=>P0+(m-x0)*(P1-P0)/L;

        s='<line x1="'+a+'" y1="'+y+'" x2="'+(b-dir*12)+'" y2="'+y+'" stroke="'+col+'" stroke-width="'+(it.w||4)+'"/><path d="M'+(b-dir*14)+','+(y-8)+' L'+b+','+y+' L'+(b-dir*14)+','+(y+8)+'Z" fill="'+col+'"/>';if(it.label)s+=T((a+b)/2,y-10,it.label,'t '+c);break}
      case 'train':{const dir=it.dir||1,hx=X(it.head),tx=X(it.head-dir*it.len),l=Math.min(hx,tx),r=Math.max(hx,tx),y=it.y,h=it.h||22,cl={g:'trg',b:'trb',s:'trs'}[it.color||'g'];
        const nose=dir>0?'M'+(r-14)+','+(y-h)+' L'+r+','+(y-h*0.45)+' L'+r+','+y+' L'+(r-14)+','+y+'Z':'M'+(l+14)+','+(y-h)+' L'+l+','+(y-h*0.45)+' L'+l+','+y+' L'+(l+14)+','+y+'Z';
        s='<g'+(it.ghost?' opacity=".42"':'')+'><rect class="trbody '+cl+'" x="'+(dir>0?l:l+12)+'" y="'+(y-h)+'" width="'+Math.max(4,r-l-12)+'" height="'+h+'" rx="4"/><path class="trbody '+cl+'" d="'+nose+'"/>';
        for(let wx=l+10;wx<r-20;wx+=22)s+='<rect class="w" x="'+wx+'" y="'+(y-h+5)+'" width="11" height="8" rx="2"/>';
        s+='<circle cx="'+(l+10)+'" cy="'+(y+2)+'" r="3.5" fill="#56645c"/><circle cx="'+(r-10)+'" cy="'+(y+2)+'" r="3.5" fill="#56645c"/></g>';if(it.label)s+=T((l+r)/2,y-h-8,it.label,'s '+(it.lcls||c)+' strong');break}

 function extendCounter(){

   const a=[...positions].sort((x,y)=>x-y);if(!a.length)return witness();const out=[...a],eps=1e-7;

   prizes.forEach((a,idx)=>{const got=a.flatMap((v,j)=>v>0?[j]:[]);if(got.length>=c.need)return;const chosen=new Set(got);for(let j=0;chosen.size<c.need-1&&j<a.length;j++)chosen.add(j);

/* ================= 整除：判定方法讲解（第13讲起） ================= */
const DMETHOD={2:'tail',5:'tail',10:'tail',4:'tail',25:'tail',100:'tail',8:'tail',125:'tail',1000:'tail',3:'sum',9:'sum',11:'alt',7:'seg3',13:'seg3',99:'seg2',33:'seg2'};
const MNAME={tail:'看末位',sum:'数字和',alt:'奇偶位差',seg3:'三位分段',seg2:'两位分段',direct:'直接除'};
const tailK=d=>[2,5,10].includes(d)?1:[4,25,100].includes(d)?2:3;
const TAILW=['','个位','末两位','末三位'];
const stripT=s=>String(s).replace(/<[^>]+>/g,'');
function divLine(a,d){const q=Math.floor(a/d),r=a%d;return a+' ÷ '+d+' = '+q+(r?'……'+r:'')}
function segsOf(s,k){const out=[];for(let e=s.length;e>0;e-=k)out.unshift([Math.max(0,e-k),e]);return out}
/* 把一个数能否被 d 整除，拆成可逐步揭晓的几步：每步可高亮数位、插入分段线、追加一行算式 */
function explainDiv(n,d,m){
  const s=String(n),L=s.length,D=[...s].map(Number),ok=n%d===0,st=[];m=m||DMETHOD[d]||'direct';
  const mark=f=>{const o={};D.forEach((_,i)=>{const c=f(i);if(c)o[i]=c});return o};
  if(m==='tail'){const k=Math.min(tailK(d),L),t=n%Math.pow(10,k),ts=s.slice(L-k);
    st.push({tiles:mark(i=>i>=L-k?'hot':'dim'),line:'只看'+TAILW[k]+'：<b>'+ts+'</b>'});
    if(d===2)st.push({line:'个位 '+t+(t%2?' 是奇数':' 是偶数')});
    else if(d===5)st.push({line:'个位 '+t+(ok?' 是 0 或 5':' 不是 0，也不是 5')});
    else if(d===10)st.push({line:'个位 '+t+(ok?' 是 0':' 不是 0')});
    else if(d===25)st.push({line:ts+(ok?' 是 00、25、50、75 中的一个':' 不是 00、25、50、75 中的任何一个')});
    else st.push({line:divLine(t,d)});
  }else if(m==='sum'){const sum=D.reduce((a,b)=>a+b,0);
    st.push({tiles:mark(()=>'sum'),line:'把各位数字加起来'});
    st.push({line:D.join(' + ')+' = <b>'+sum+'</b>'});
    st.push({line:'数字和 '+divLine(sum,d)});
  }else if(m==='alt'){let a=0,b=0;const od=[],ev=[];D.forEach((x,i)=>{if((L-1-i)%2===0){a+=x;od.unshift(x)}else{b+=x;ev.unshift(x)}});
    st.push({tiles:mark(i=>(L-1-i)%2===0?'odd':'even'),line:'从个位起交替分组：<i class="c-odd">奇数位</i>、<i class="c-even">偶数位</i>'});
    st.push({line:'奇数位 '+od.join(' + ')+' = <b>'+a+'</b>；偶数位 '+(ev.length>1?ev.join(' + ')+' = ':'')+'<b>'+b+'</b>'});
    const df=Math.abs(a-b);st.push({line:'相差 '+Math.max(a,b)+' − '+Math.min(a,b)+' = <b>'+df+'</b>'});
    st.push({line:df===0?'差是 0，0 是 11 的倍数':divLine(df,d)});
  }else if(m==='seg3'||m==='seg2'){const k=m==='seg3'?3:2,sg=segsOf(s,k),seps=sg.slice(1).map(x=>x[0]),parts=sg.map(([x,y])=>s.slice(x,y)),odd=j=>(sg.length-1-j)%2===0;
    st.push({tiles:mark(i=>{const j=sg.findIndex(([x,y])=>i>=x&&i<y);return k===2?(j%2?'seg':'seg2'):(odd(j)?'odd':'even')}),seps:seps,line:'从右往左每'+(k===3?'三':'两')+'位一段：<b>'+parts.join(' | ')+'</b>'});
    if(k===2){const sum=parts.reduce((a,b)=>a+(+b),0);st.push({line:'各段相加 '+parts.map(Number).join(' + ')+' = <b>'+sum+'</b>'});st.push({line:divLine(sum,d)})}
    else{let A=0,B=0;const oa=[],eb=[];parts.forEach((p,j)=>{if(odd(j)){A+=+p;oa.unshift(+p)}else{B+=+p;eb.unshift(+p)}});
      st.push({line:'<i class="c-odd">奇数段</i> '+(oa.length>1?oa.join(' + ')+' = ':'')+'<b>'+A+'</b>'+(eb.length?'；<i class="c-even">偶数段</i> '+(eb.length>1?eb.join(' + ')+' = ':'')+'<b>'+B+'</b>':'')});
      const df=Math.abs(A-B);st.push({line:(eb.length?'相差 '+Math.max(A,B)+' − '+Math.min(A,B)+' = ':'只有一段：')+'<b>'+df+'</b>'});
      st.push({line:df===0?'差是 0，能被 '+d+' 整除':divLine(df,d)})}
  }else st.push({tiles:mark(()=>'sum'),line:divLine(n,d)});
  return {s,ok,m,steps:st};
}
